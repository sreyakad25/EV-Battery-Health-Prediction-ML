services:
  - type: web
    name: electric-vehicle-battery-health
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "127.0.0.1,localhost,.onrender.com,.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: FIREBASE_API_KEY
        value: "AIzaSyAD_WHg0kPsh7Fq24WWNgWOVnP_0sZDOLY"
      - key: FIREBASE_AUTH_DOMAIN
        value: "ev-battery-health-prediction.firebaseapp.com"
      - key: FIREBASE_PROJECT_ID
        value: "ev-battery-health-prediction"
      - key: FIREBASE_STORAGE_BUCKET
        value: "ev-battery-health-prediction.firebasestorage.app"
      - key: FIREBASE_MESSAGING_SENDER_ID
        value: "896451830653"
      - key: FIREBASE_APP_ID
        value: "1:896451830653:web:f329a42cc386a6e5ab6214"
      - key: FIREBASE_MEASUREMENT_ID
        value: "G-3W7RSWENQD"
